name: E2E on OpenShift

on:
  workflow_dispatch:
    inputs:
      test_spec:
        description: Optional Playwright test spec path (defaults to full suite)
        required: false
        default: ''
      base_url:
        description: Test web base URL
        required: false
        default: https://myrangebc-dev.apps.silver.devops.gov.bc.ca
      api_base_url:
        description: Test API base URL (origin + /api)
        required: false
        default: https://myrangebc-dev.apps.silver.devops.gov.bc.ca/api
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: e2e-openshift
  cancel-in-progress: true

env:
  NAMESPACE_TOOLS: 3187b2-tools
  NAMESPACE_DEV: 3187b2-dev
  E2E_IMAGE_TAG: latest
  E2E_BASE_URL: https://myrangebc-dev.apps.silver.devops.gov.bc.ca
  E2E_API_BASE_URL: https://myrangebc-dev.apps.silver.devops.gov.bc.ca/api

jobs:
  build-e2e-image:
    name: Build e2e image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: '4'
      - uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
      - name: Build e2e image from pushed revision
        run: |
          oc start-build range-web-e2e -n "$NAMESPACE_TOOLS" --from-dir=. --follow --wait

  wait-for-dev-deploy:
    name: Wait for dev deployment
    needs: [build-e2e-image]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.build-e2e-image.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Skip deployment wait on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "workflow_dispatch: skipping dev deployment wait"
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - uses: redhat-actions/openshift-tools-installer@v1
        if: github.event_name == 'push'
        with:
          oc: '4'
      - uses: redhat-actions/oc-login@v1
        if: github.event_name == 'push'
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
      - name: Wait for tools build
        if: github.event_name == 'push'
        run: |
          latest_build=""
          for i in $(seq 1 60); do
            for build in $(oc get builds -l buildconfig=range-web -n "$NAMESPACE_TOOLS" --sort-by=.metadata.creationTimestamp -o name 2>/dev/null); do
              revision=$(oc get "$build" -n "$NAMESPACE_TOOLS" -o jsonpath='{.spec.revision.git.commit}' 2>/dev/null || true)
              if [ "$revision" = "$GITHUB_SHA" ]; then
                latest_build="$build"
                break
              fi
            done
            if [ -n "$latest_build" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$latest_build" ]; then
            echo "::error::No range-web build found for revision $GITHUB_SHA"
            exit 1
          fi
          oc logs -f "$latest_build" -n "$NAMESPACE_TOOLS" 2>&1 || true
          phase=""
          for i in $(seq 1 30); do
            phase=$(oc get "$latest_build" -n "$NAMESPACE_TOOLS" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            if [ "$phase" = "Complete" ] || [ "$phase" = "Failed" ] || [ "$phase" = "Cancelled" ] || [ "$phase" = "Error" ]; then
              break
            fi
            sleep 5
          done
          if [ "$phase" != "Complete" ]; then
            echo "::error::$latest_build ended with phase $phase"
            exit 1
          fi
      - name: Wait for dev image deployment
        if: github.event_name == 'push'
        run: |
          deployed=""
          for i in $(seq 1 90); do
            latest=$(oc get istag range-web-caddy:latest -n "$NAMESPACE_TOOLS" -o jsonpath='{.image.metadata.name}' 2>/dev/null || true)
            dev_image=$(oc get deployment range-web-caddy -n "$NAMESPACE_DEV" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            if [ -n "$latest" ] && [[ "$dev_image" == *"@$latest" ]]; then
              deployed="true"
              break
            fi
            sleep 20
          done
          if [ "$deployed" != "true" ]; then
            echo "::error::Dev deployment did not update to the latest range-web-caddy image within 30 minutes"
            exit 1
          fi
      - name: Wait for dev rollout
        if: github.event_name == 'push'
        run: |
          oc rollout status deployment/range-web-caddy -n "$NAMESPACE_DEV" --timeout=10m

  e2e:
    name: Run e2e suite
    runs-on: ubuntu-latest
    needs: [build-e2e-image, wait-for-dev-deploy]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (needs.build-e2e-image.result == 'success' &&
      needs.wait-for-dev-deploy.result == 'success'))
    steps:
      - uses: actions/checkout@v4
      - uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: '4'
      - uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
      - name: Ensure e2e image exists
        run: |
          if ! oc get istag range-web-e2e:latest -n "$NAMESPACE_TOOLS" >/dev/null 2>&1; then
            echo "::error::range-web-e2e:latest not found in $NAMESPACE_TOOLS. Build it first: oc start-build range-web-e2e -n $NAMESPACE_TOOLS"
            exit 1
          fi
      - name: Create e2e job
        run: |
          oc delete job range-web-e2e -n "$NAMESPACE_DEV" --ignore-not-found=true >/dev/null 2>&1 || true
          oc process -f openshift/deployments/e2e.yaml -n "$NAMESPACE_DEV" \
            -p E2E_IMAGE="image-registry.openshift-image-registry.svc:5000/$NAMESPACE_TOOLS/range-web-e2e:$E2E_IMAGE_TAG" \
            -p PLAYWRIGHT_BASE_URL="${{ github.event.inputs.base_url || env.E2E_BASE_URL }}" \
            -p PLAYWRIGHT_API_BASE_URL="${{ github.event.inputs.api_base_url || env.E2E_API_BASE_URL }}" \
            -p PLAYWRIGHT_TEST_SPEC="${{ github.event.inputs.test_spec || '' }}" \
            | oc create -f - -n "$NAMESPACE_DEV"
      - name: Wait for suite to finish
        id: suite
        run: |
          pod=""
          for i in $(seq 1 30); do
            pod=$(oc get pods -l job-name=range-web-e2e -n "$NAMESPACE_DEV" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$pod" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$pod" ]; then
            echo "::error::e2e job pod never scheduled"
            exit 1
          fi
          exit_code=""
          for i in $(seq 1 90); do
            exit_code=$(oc get pod "$pod" -n "$NAMESPACE_DEV" -o jsonpath='{.status.containerStatuses[?(@.name=="e2e")].state.terminated.exitCode}' 2>/dev/null || true)
            if [ -n "$exit_code" ]; then
              break
            fi
            sleep 30
          done
          if [ -z "$exit_code" ]; then
            echo "::error::Timed out waiting for the e2e suite to finish"
            exit 1
          fi
          echo "::notice::e2e suite finished with exit code $exit_code"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
      - name: Capture suite logs
        if: always()
        continue-on-error: true
        run: |
          oc logs -c e2e job/range-web-e2e -n "$NAMESPACE_DEV" > e2e-logs.txt || true
      - name: Copy report and traces
        if: always()
        continue-on-error: true
        run: |
          pod=$(oc get pods -l job-name=range-web-e2e -n "$NAMESPACE_DEV" -o jsonpath='{.items[0].metadata.name}')
          mkdir -p playwright-report playwright-artifacts
          oc cp "$pod:/e2e/results/report/." playwright-report -c artifact-sync -n "$NAMESPACE_DEV" || true
          oc cp "$pod:/e2e/results/artifacts/." playwright-artifacts -c artifact-sync -n "$NAMESPACE_DEV" || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          if-no-files-found: warn
          path: |
            e2e-logs.txt
            playwright-report/
            playwright-artifacts/
      - name: Cleanup job
        if: always()
        run: |
          oc delete job range-web-e2e -n "$NAMESPACE_DEV" --ignore-not-found=true
      - name: Fail on suite failure
        if: always() && steps.suite.outputs.exit_code != '' && steps.suite.outputs.exit_code != '0'
        run: |
          echo "::error::e2e suite failed (exit code ${{ steps.suite.outputs.exit_code }})"
          exit 1
